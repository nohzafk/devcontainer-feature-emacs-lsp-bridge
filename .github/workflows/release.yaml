name: "Release dev container features & Generate Documentation"
on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-release]

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: write
    steps:
      - uses: actions/checkout@v3

      - name: "Publish Features"
        uses: devcontainers/action@v1
        with:
          publish-features: "true"
          base-path-to-features: "./src"
          generate-docs: "true"

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep the 3 latest feature release tags
        env:
          KEEP_RELEASES: 3
        run: |
          set -euo pipefail

          mapfile -t tags < <(
            git ls-remote --tags --refs origin 'refs/tags/feature_*' |
              awk '$2 ~ /^refs\/tags\/feature_.+_[0-9]+\.[0-9]+\.[0-9]+$/ {
                sub("refs/tags/", "", $2)
                print $2
              }'
          )
          mapfile -t versions < <(
            printf '%s\n' "${tags[@]}" |
              sed -nE 's/.*_([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' |
              sort -Vu |
              tail -n "$KEEP_RELEASES"
          )

          declare -A keep=()
          for version in "${versions[@]}"; do
            keep["$version"]=1
          done

          old_tags=()
          for tag in "${tags[@]}"; do
            version=${tag##*_}
            [[ ${keep[$version]:-} ]] || old_tags+=("$tag")
          done

          if ((${#old_tags[@]})); then
            printf '%s\0' "${old_tags[@]}" |
              xargs -0 -n 500 git push --quiet origin --delete
          fi

          echo "Kept ${#versions[@]} releases; deleted ${#old_tags[@]} tags."

      - name: Create PR for Documentation
        id: push_image_info
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo "Start."
          # Configure git and Push updates
          git config --global user.email github-actions[bot]@users.noreply.github.com
          git config --global user.name github-actions[bot]
          git config pull.rebase false
          branch=automated-documentation-update-$GITHUB_RUN_ID
          git checkout -b $branch
          message='Automated documentation update'
          # Add / update and commit
          git add */**/README.md
          git commit -m 'Automated documentation update [skip ci]' || export NO_UPDATES=true
          # Push
          if [ "$NO_UPDATES" != "true" ] ; then
              git push origin "$branch"
              gh pr create --title "$message" --body "$message"
          fi
